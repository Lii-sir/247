[project]
name = "yinxkj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.24",
    "pillow>=10,<13",
    "pyyaml>=6,<7",
    "opencv-python>=4.8,<6",
    "scipy>=1.10,<2",
    "ultralytics>=8.3,<9",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[project.scripts]
247-likai = "yinxkj:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "yinxkj"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true